<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>截图选区</title>
    <link rel="stylesheet" href="screenshotSelect.css">
</head>
<body>
    <canvas id="screenCanvas"></canvas>
    <div id="selectionOverlay" class="selection-overlay">
        <div id="selectionRect" class="selection-rect"></div>
    </div>
    <div id="sizeIndicator" class="size-indicator"></div>
    <div id="hint" class="hint">拖拽鼠标选择截图区域，按 ESC 取消</div>
    <script type="module" src="index.js"></script>
</body>
</html>
